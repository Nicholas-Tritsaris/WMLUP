# Lightweight Nginx config for Raspberry Pi
# Optimized for WMLUP TLU Server (Update delivery)

server {
    listen 80;
    server_name tlu.blueboop.is-a.dev;

    # Set root for update files
    root /var/www/wmlup/tlu;

    location /updates/ {
        # Enable directory listing (optional, but helpful for debugging)
        autoindex on;

        # Enable HTTP range requests for resumable downloads
        # Nginx does this by default if requested

        # Add correct MIME type for .cab files
        types {
            application/vnd.ms-cab-compressed cab;
        }

        # Cache-Control: allow caching of update files
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Access log specifically for updates
        access_log /var/log/nginx/wmlup_tlu_access.log;
    }

    # Custom 404 for missing updates
    error_page 404 /404.html;
    location = /404.html {
        internal;
        return 404 "Update file not found on WMLUP TLU Server.";
    }
}
